name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Player tests
        run: node --test tests/*.test.mjs
      - name: Install PWA test dependencies
        run: npm ci
        working-directory: pwa
      - name: PWA tests
        run: npm test
        working-directory: pwa
